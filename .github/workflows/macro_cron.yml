name: Macro Economic Wire Cron

on:
  schedule:
    # Runs daily at 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Ingest Macro Data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        run: |
          python3 ingest_macro.py

      - name: Commit and push updates
        run: |
          git config user.name "macro-wire-bot[bot]"
          git config user.email "macro-wire-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No macro shifts detected today. Skipping commit."
          else
            git commit -m "chore(macro): publish daily economic indicators [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
